name: Portfolio - Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Portfolio.Tests/Portfolio.Tests.csproj

      - name: Run tests and collect code coverage
        run: dotnet test tests/Portfolio.Tests/Portfolio.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=portfolio-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-test-results
          path: tests/Portfolio.Tests/TestResults/
          if-no-files-found: ignore
